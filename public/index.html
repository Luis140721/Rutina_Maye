<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rutina Maye</title>
  <meta name="description" content="Rutina de entrenamiento personalizada: 5 días, animaciones, progreso y ciclos de 14 semanas.">
  <meta name="theme-color" content="#c2255c" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rutina Maye">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="#hoy" class="brand" aria-label="Inicio"><img src="./icons/icon.svg" alt="" width="28" height="28"></a>
      <div class="topbar-text">
        <h1 id="titulo">Hoy</h1>
        <p id="subtitulo" class="muted"></p>
      </div>
      <button type="button" id="ayuda" class="btn-icon topbar-help" aria-label="Ayuda" title="Ayuda">?</button>
    </div>
  </header>

  <main id="vista" class="vista" aria-live="polite"></main>

  <div id="timer" class="timer" hidden>
    <div class="timer-inner">
      <div>
        <div class="timer-label">Descanso</div>
        <div class="timer-time" id="timer-time">2:30</div>
      </div>
      <div class="timer-actions">
        <button class="btn btn-ghost" id="timer-mas" type="button">+30 s</button>
        <button class="btn btn-ghost" id="timer-skip" type="button">Listo</button>
      </div>
    </div>
  </div>

  <nav class="tabs" aria-label="Secciones">
    <a href="#hoy" data-tab="hoy"><span class="tab-ico">🏠</span><span>Hoy</span></a>
    <a href="#rutina" data-tab="rutina"><span class="tab-ico">📋</span><span>Rutina</span></a>
    <a href="#progreso" data-tab="progreso"><span class="tab-ico">📈</span><span>Progreso</span></a>
    <a href="#maquinas" data-tab="maquinas"><span class="tab-ico">📷</span><span>Máquinas</span></a>
    <a href="#ciclo" data-tab="ciclo"><span class="tab-ico">🔁</span><span>Ciclo</span></a>
  </nav>

  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h2 id="modal-title"></h2>
        <button class="btn-icon" id="modal-close" type="button" aria-label="Cerrar">✕</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
